name = "umba-api"
main = "worker.js"
compatibility_date = "2026-01-01"

[vars]
SITE_URL = "https://rebirthsoftware-code.github.io/umba"
ALLOWED_ORIGIN = "https://rebirthsoftware-code.github.io"
TEST_MODE = "1"
# NOTIFY_WEBHOOK = "https://formspree.io/f/xxxxxxxx"   # yeni siparişte e-posta bildirimi (isteğe bağlı)

# Gizli değerler (terminalden, bir kez):
#   npx wrangler secret put PAYTR_MERCHANT_ID
#   npx wrangler secret put PAYTR_MERCHANT_KEY
#   npx wrangler secret put PAYTR_MERCHANT_SALT
#   npx wrangler secret put ADMIN_PASSWORD        # yönetim paneli şifresi

# Sipariş veritabanı (D1, ücretsiz plan yeterli):
#   npx wrangler d1 create umba-orders            → çıkan database_id'yi aşağıya yazın
#   npx wrangler d1 execute umba-orders --remote --file=schema.sql
[[d1_databases]]
binding = "DB"
database_name = "umba-orders"
database_id = "DEGISTIR-database_id"
